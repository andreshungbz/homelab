##

[[repo]]
name = "homelab"
[repo.config]
git_account = "andreshungbz"
repo = "andreshungbz/homelab"

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every Sunday at 2:00 am"

[[procedure.config.stage]]
name = "Backup"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Update"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Prune Docker"
tags = ["system"]
config.schedule = "Every Sunday at 4:00 am"

[[procedure.config.stage]]
name = "Clean"
enabled = true
executions = [
  { execution.type = "PruneContainers", execution.params.server = "dragon", enabled = true },
  { execution.type = "PruneNetworks", execution.params.server = "dragon", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "dragon", enabled = true },
  { execution.type = "None", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Rotate Server Keys"
description = "Rotates all currently connected Server keys."
tags = ["system"]
config.schedule = "Every day at 06:00"

[[procedure.config.stage]]
name = "Rotate"
enabled = true
executions = [
  { execution.type = "RotateAllServerKeys", execution.params = {}, enabled = true }
]

##

[[builder]]
name = "dragon"
[builder.config]
type = "Server"
params.servers = ["dragon"]

##

[[resource_sync]]
name = "komodo-sync"
[resource_sync.config]
linked_repo = "homelab"
resource_path = ["komodo/sync.toml"]
managed = true