services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2
    container_name: uptimekuma
    ports:
      - "127.0.0.1:6218:3001"
    volumes:
      - ${DATA_DIR}/uptimekuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-America/Belize}
      UMASK: "0022"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  default:
    name: uptimekuma-net
