services:
  trilium:
    image: triliumnext/trilium:latest
    container_name: trilium
    restart: unless-stopped
    ports:
      - "127.0.0.1:6223:8080"
    environment:
      TZ: ${TZ:-America/Belize}
    volumes:
      - ${DATA_DIR}/trilium:/home/node/trilium-data

networks:
  default:
    name: trilium-net
