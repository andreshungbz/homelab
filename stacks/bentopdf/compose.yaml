name: bentopdf

services:
  bentopdf:
    container_name: bentopdf
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
    image: ghcr.io/alam00000/bentopdf-simple:latest
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
