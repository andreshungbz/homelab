services:
  vikunja:
    image: docker.io/vikunja/vikunja:latest
    container_name: vikunja
    user: "0:0"
    ports:
      - "127.0.0.1:6220:3456"
    volumes:
      - ${DATA_DIR}/vikunja/files:/app/vikunja/files
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
      VIKUNJA_DATABASE_HOST: ${VIKUNJA_DATABASE_HOST:-db}
      VIKUNJA_DATABASE_TYPE: ${VIKUNJA_DATABASE_TYPE:-postgres}
      VIKUNJA_DATABASE_USER: ${VIKUNJA_DATABASE_USER}
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DATABASE_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DATABASE_DATABASE}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      TZ: ${TZ:-America/Belize}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vikunja_backend
    restart: unless-stopped

  db:
    image: docker.io/paradedb/paradedb:latest
    container_name: vikunja-db
    volumes:
      - ${DATA_DIR}/vikunja/db:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - vikunja_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  vikunja_backend:
    driver: bridge
